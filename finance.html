<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Andaluma Finance">
<meta name="application-name" content="Andaluma Finance">
<meta name="theme-color" content="#1A1208">
<meta name="mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="light">
<title>Finance · Andaluma</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script>document.write('<link rel="stylesheet" href="css/app.css?v='+Date.now()+'">');</script>
<style>
/* Standalone-page chrome not needed inside the app tab */
.fin-standalone-hdr{background:var(--dark);padding:18px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.fin-standalone-brand{display:flex;align-items:center;gap:12px}
.fin-standalone-logo{display:grid;grid-template-columns:1fr 1fr;gap:2px;width:34px;flex-shrink:0}
.fin-standalone-logo div{height:16px;border-radius:2px}
.fin-standalone-title{font-family:'Playfair Display',serif;font-size:17px;color:white}
.fin-standalone-back{color:rgba(255,255,255,0.55);font-size:12px;font-weight:600;text-decoration:none;border:1px solid rgba(255,255,255,0.2);border-radius:16px;padding:6px 12px}
</style>
</head>
<body>
<div id="root">

<!-- PIN LOGIN -->
<div id="pin-screen" style="display:none;min-height:100vh;background:#1A1208;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px">
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;width:80px;margin-bottom:24px">
    <div style="background:#E04F28;height:36px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:white;font-family:Georgia,serif;font-weight:700;font-size:12px">An</div>
    <div style="background:#B83368;height:36px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:white;font-family:Georgia,serif;font-weight:700;font-size:12px">Da</div>
    <div style="background:#0A7A88;height:36px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:white;font-family:Georgia,serif;font-weight:700;font-size:12px">Lu</div>
    <div style="background:#C98A10;height:36px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:white;font-family:Georgia,serif;font-weight:700;font-size:12px">Ma</div>
  </div>
  <div style="font-family:Georgia,serif;font-size:28px;color:white;margin-bottom:8px;letter-spacing:0.06em">Finance</div>
  <div style="font-size:13px;color:rgba(255,255,255,0.4);margin-bottom:40px">Enter your PIN to continue</div>

  <div id="pin-dots" style="display:flex;gap:14px;margin-bottom:32px">
    <div class="pdot"></div>
    <div class="pdot"></div>
    <div class="pdot"></div>
    <div class="pdot"></div>
  </div>

  <div id="pin-error" style="color:#E04F28;font-size:13px;margin-bottom:16px;min-height:20px;text-align:center"></div>

  <div id="pin-pad" style="display:grid;grid-template-columns:repeat(3,72px);gap:10px">
    <button class="pkey" data-n="1">1</button>
    <button class="pkey" data-n="2">2</button>
    <button class="pkey" data-n="3">3</button>
    <button class="pkey" data-n="4">4</button>
    <button class="pkey" data-n="5">5</button>
    <button class="pkey" data-n="6">6</button>
    <button class="pkey" data-n="7">7</button>
    <button class="pkey" data-n="8">8</button>
    <button class="pkey" data-n="9">9</button>
    <div></div>
    <button class="pkey" data-n="0">0</button>
    <button class="pkey pkey-del" data-n="del">&#x232B;</button>
  </div>
</div>

<!-- APP (standalone Finance page) -->
<div id="app" style="display:none;flex-direction:column;flex:1;min-height:0;height:100vh">
  <div class="fin-standalone-hdr">
    <div class="fin-standalone-brand">
      <div class="fin-standalone-logo">
        <div style="background:#E04F28"></div><div style="background:#B83368"></div>
        <div style="background:#0A7A88"></div><div style="background:#C98A10"></div>
      </div>
      <div class="fin-standalone-title">Finance</div>
    </div>
    <a class="fin-standalone-back" href="https://app.andaluma.com">Open Planner →</a>
  </div>
  <div style="flex:1;min-height:0;overflow-y:auto;background:var(--cream)">
    <div id="finance-root"></div>
  </div>
</div>

</div>

<!-- MODAL -->
<div id="modal-overlay" style="display:none" onclick="bgClose(event)">
  <div class="msheet" id="mcontent"></div>
</div>

<script>var STANDALONE_PAGE = true;</script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
var _v = Date.now();
['js/core.js','js/finance.js'].forEach(function(src){
  document.write('<script src="'+src+'?v='+_v+'"><\/script>');
});
</script>

</body>
</html>
